name: 1 · Deploy Canary

on:
  push:
    branches: [master]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/pixelcodeeee/arroyo_seco_pwa_stage2/frontend:canary

  deploy-and-route:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Ops Repository
        uses: actions/checkout@v4
        with:
          repository: PixelCodeeee/arroyo-ops
          path: ops
          token: ${{ secrets.GH_PAT }}

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_IAP_CREDENTIALS }}'

      - uses: google-github-actions/setup-gcloud@v2

      # FIX: SCP to /tmp first, then SSH to move it and fix permissions
      - name: Sync compose file to VM
        run: |
          gcloud compute scp docker-compose.yml nginx-public-vm:/tmp/docker-compose.yml \
            --zone=us-central1-a \
            --tunnel-through-iap \
            --project=beta-prime-489121

          gcloud compute ssh nginx-public-vm \
            --zone=us-central1-a \
            --tunnel-through-iap \
            --project=beta-prime-489121 \
            --command="sudo mkdir -p /home/joshualuna/arroyo_seco_pwa_stage2 && sudo mv /tmp/docker-compose.yml /home/joshualuna/arroyo_seco_pwa_stage2/docker-compose.yml && sudo chown joshualuna:joshualuna /home/joshualuna/arroyo_seco_pwa_stage2/docker-compose.yml"

      # FIX: Add sudo to docker commands to bypass OS login permission issues
      - name: Pull and restart canary frontend
        run: |
          gcloud compute ssh nginx-public-vm \
            --zone=us-central1-a \
            --tunnel-through-iap \
            --project=beta-prime-489121 << 'EOF'
              # Authenticate Docker
              echo '${{ secrets.GH_PAT }}' | sudo docker login ghcr.io -u itsjluna --password-stdin
              
              cd /home/joshualuna/arroyo_seco_pwa_stage2
              
              # Deploy Canary
              sudo docker compose pull frontend-canary
              sudo docker compose up -d --no-deps frontend-canary

              echo "Waiting for containers to boot..."
              sleep 10
              
              # Check health - no extra escaping needed for jq inside heredoc
              UNHEALTHY=$(sudo docker compose ps --format json | jq '[.[] | select(.Health == "unhealthy" or .State != "running")] | length')
              
              if [ "$UNHEALTHY" -gt 0 ]; then
                echo "🚨 Containers not healthy, aborting manifest sync"
                exit 1
              fi

              # Clean up disk space
              sudo docker system prune -a -f
          EOF

      # NEW: Ensure the Ops repo knows this frontend is ready for the cutover
      - name: Sync with Ops Repository
        run: |
          cd ops
          # Force CommonJS mode by renaming to .cjs
          mv scripts/sync.js scripts/sync.cjs
          
          git pull --rebase origin HEAD || true
          
          # Run the .cjs version
          node scripts/sync.cjs frontend "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" || BLOCKED=1
             
          git config user.email "ci@arroyoseco.online"
          git config user.name "CI Bot"
          git add manifests/canary.json
          git commit -m "canary sync: frontend ready @ ${{ github.sha }}" || echo "No changes to commit"
          git push origin HEAD
          
          [ -z "$BLOCKED" ] || exit 1